app:
  name: Element Orion
  workspace_root: .
  session_dir: ./.element-orion
  memory_dir: ./.element-orion/memory
  load_all_memory_shards: false
  max_agent_loops: 32
  max_tool_calls_per_turn: 96
  history_compaction:
    enabled: true
    trigger_tokens: 12000
    target_tokens: 7000
    preserve_recent_messages: 16

llm:
  api_type: openai
  base_url: http://49.205.178.204:11434/v1
  api_key: "llama-cpp"
  api_key_env: ""
  model: deepseek-v4-flash
  models:
    - name: deepseek-v4-flash
      model: unsloth/DeepSeek-V4-Flash-0731-GGUF:UD-Q4_K_XL
      enabled: true
    - name: mistral-large
      model: admin_mistral_ai_fahadbinhussain001/mistral-large-latest
      enabled: false
      base_url: https://litellm-fjfe.onrender.com/v1
      api_key_env: LITELLM_API_KEY
    - name: mistral-small
      model: admin_mistral_ai_fahadbinhussain001/mistral-small-latest
      enabled: false
      base_url: https://litellm-fjfe.onrender.com/v1
      api_key_env: LITELLM_API_KEY
    - name: deepseek-v3.2
      model: cloud_sambanova_ai_fahadbinhussain001/DeepSeek-V3.2
      enabled: false
      base_url: https://litellm-fjfe.onrender.com/v1
      api_key_env: LITELLM_API_KEY
    - name: deepseek-v3.1
      model: cloud_sambanova_ai_fahadbinhussain001/DeepSeek-V3.1
      enabled: false
      base_url: https://litellm-fjfe.onrender.com/v1
      api_key_env: LITELLM_API_KEY
    - name: llama-3.3-samba
      model: cloud_sambanova_ai_fahadbinhussain001/Meta-Llama-3.3-70B-Instruct
      enabled: false
      base_url: https://litellm-fjfe.onrender.com/v1
      api_key_env: LITELLM_API_KEY
    - name: llama-3.3-groq
      model: console_groq_com_fahadbinhussain001/llama-3.3-70b-versatile
      enabled: false
      base_url: https://litellm-fjfe.onrender.com/v1
      api_key_env: LITELLM_API_KEY
    - name: command-r
      model: dashboard_cohere_com_fahadbinhussain001/command-r-08-2024
      enabled: false
      base_url: https://litellm-fjfe.onrender.com/v1
      api_key_env: LITELLM_API_KEY
    - name: gemini-3.5-flash
      model: gemini-3.5-flash
      enabled: false
      base_url: https://litellm-fjfe.onrender.com/v1
      api_key_env: LITELLM_API_KEY
  vision_enabled: false
  reasoning_effort: off
  max_thinking_token: off
  temperature: 0.4
  max_tokens: 3200
  context_window_tokens: 28000
  inject_message_timestamps: true
  timeout: 180s
  request_max_attempts: 3
  retry_initial_backoff: 2s
  retry_max_backoff: 8s
  headers: {}
  kimi-no-think: false
  glm-no-think: false

tools:
  enabled:
    - send_discord_message
    - add_discord_reaction
    - discord_api_request
    - read_file
    - write_file
    - replace_in_file
    - list_dir
    - grep_search
    - mkdir
    - move_path
    - delete_path
    - compact_context
    - send_discord_file
    - start_background_task
    - list_background_tasks
    - get_background_task
    - get_background_task_logs
    - cancel_background_task
    - schedule_heartbeat_wakeup
    - list_scheduled_wakeups
    - cancel_scheduled_wakeup
    - read_previous_messages
    - add_rss_feed
    - list_rss_feeds
    - read_rss_feed
    - remove_rss_feed
    - reminders
    - search_gifs
    - get_weather
    - search_web
    - search_news
  exec_shell: /bin/bash
  exec_timeout: 120s
  max_file_bytes: 1048576
  max_search_results: 50
  max_command_output_bytes: 65536
  allowed_commands: []

background_tasks:
  default_min_runtime: 90s
  inject_current_time: true
  max_event_log_entries: 300
  sandbox:
    enabled: false
    force: false
    use_sudo: false
    provider: nspawn
    release: stable
    architecture: amd64
    mirror: http://deb.debian.org/debian/
    machines_dir: ./.element-orion/sandboxes
    setup_timeout: 20m
    auto_cleanup: true

dashboard:
  enabled: false
  listen_addr: 127.0.0.1:8788
  path: /dashboard

skills:
  enabled: true
  load:
    user_dir: "~/.openclaw/skills"
    bundled_dir: ../skills/bundled
    extra_dirs: []

discord:
  token_mode: bot
  bot_token: ""
  bot_token_env: DISCORD_BOT_TOKEN
  allow_direct_messages: false
  allow_group_direct_messages: false
  allowed_guild_ids:
    - 751043966182621234
  allowed_dm_user_ids: []
  allowed_outbound_channel_ids:
    - 1537650032441032765
  guild_session_scope: channel
  reply_to_message: false
  download_incoming_attachments: true
  incoming_attachments_dir: ./.element-orion/incoming-attachments

messenger:
  enabled: true
  # cookies live INSIDE the session dir so internal/persist snapshots them to
  # Neon and restores them on every fresh boot (Render FS is ephemeral —
  # anything outside the session dir dies with the container). upload via
  # POST /api/cookies/upload (X-HF-Authorization: Bearer <bridge.secret>).
  cookies_path: ./.element-orion/messenger-cookies.json
  # send-side allowlist (murmur port): every outgoing Messenger send —
  # notifications endpoint, BNP worker, agent replies — is blocked when the
  # thread is not listed here (empty = allow all). mirrors murmur's
  # MURMUR_ALLOWED_THREAD_IDS; currently the live murmur threads.
  allowed_thread_ids:
    - 30738305889116993
    - 953525124128433
    - 2637078310061988
    - 984803114200952

whatsapp:
  enabled: true
  store_dir: ./.element-orion/whatsapp
  database_url: ""
  # Render datacenter IPs get TLS-blocked by WhatsApp; route the websocket
  # through the home laptop's socks5 proxy (100.76.10.50:1080) over a
  # tailscale mesh link: the container runs a userspace tailscale node and
  # the sockschain sidecar (cmd/sockschain) chains whatsmeow's SOCKS5
  # connection through it. WHATSAPP_PROXY_URL=socks5://127.0.0.1:1081.
  proxy: ""
  proxy_env: WHATSAPP_PROXY_URL
  # send-side allowlist (mirrors messenger.allowed_thread_ids): outgoing
  # WhatsApp sends are blocked when the chat JID is not listed (empty = allow
  # all). test thread: +880 1911-104251 -> 8801911104251@s.whatsapp.net
  allowed_jids:
    - 8801911104251@s.whatsapp.net
    - 120363409684314037@g.us

gifs:
  enabled: false
  provider: giphy
  api_key: ""
  api_key_env: GIPHY_API_KEY
  search_limit: 6
  content_filter: pg-13

image_gen:
  enabled: false
  model: cloudflare/@cf/black-forest-labs/flux-1-schnell
  output_dir: ./.element-orion/generated

heartbeat:
  every: 30m
  model: ""
  light_context: false
  isolated_session: true
  ack_max_chars: 300
  show_ok: false
  show_alerts: true
  use_indicator: true
  event_poll_interval: 5s
  active_hours:
    timezone: ""
    start: ""
    end: ""
  target:
    guild_id: ""
    channel_id: ""
    user_id: ""

dream_mode:
  enabled: false
  every: 6h
  model: ""
  light_context: false
  use_indicator: false
  sleep_hours:
    timezone: ""
    start: ""
    end: ""

event_webhook:
  enabled: false
  listen_addr: 127.0.0.1:8787
  path: /event
  secret: ""
  secret_env: ELEMENT_ORION_EVENT_WEBHOOK_SECRET
  default_mode: now

bridge:
  enabled: true
  listen_addr: 0.0.0.0:7860
  notifications_path: /api/automation/notifications
  notifications_enabled: true
  bnp_enabled: true
  secret: ""
  secret_env: ELEMENT_ORION_BRIDGE_NOTIFICATIONS_SECRET
  # cross-platform health alerts: whatsapp dead/alive -> messenger test
  # thread, messenger dead/alive -> whatsapp test jid. runs in-container so
  # it works even when the laptop (the whatsapp tailnet route) is down.
  health_watch:
    enabled: true
    interval: 15s
    dead_after: 45s
    min_notify_interval: 2m
    messenger_thread_id: "2637078310061988"
    whatsapp_jid: "8801911104251@s.whatsapp.net"
    discord_channel_id: "1537650032441032765"
  # route = list of channels to fan notifications out to. used by the BNP
  # worker (BNP_ROUTE env, default "bnp") and by the notifications endpoint
  # via the optional "route" body field. the messenger channel is the
  # primary: its message ID feeds the BNP ack contract; every other channel
  # is best-effort. adding a channel = edit this list + deploy, no code.
  routes:
    bnp:
      - platform: messenger
        thread_id: "984803114200952"
      - platform: whatsapp
        jid: "120363409684314037@g.us"
  # admin_threads: per-platform threads allowed to run the admin commands
  # (/threads /allow /block /allowlist). empty list = nobody. currently only
  # the test channels — keep it that way unless a real thread needs it.
  admin_threads:
    messenger:
      - "2637078310061988"
    whatsapp:
      - "8801911104251@s.whatsapp.net"
    discord:
      - "1537650032441032765"

notify:
  # lumen's own notifications endpoint (murmur space default is dead/paused)
  webhook_url: https://lumen-aqyl.onrender.com/api/automation/notifications
  webhook_token_env: ELEMENT_ORION_BRIDGE_NOTIFICATIONS_SECRET
  # murmur's Neon (steam_seen/game_seen) for dedupe continuity at cutover;
  # separate from DATABASE_URL (lumen's own persistence/whatsapp DB).
  database_url_env: NOTIFY_DATABASE_URL
  steam_updates:
    enabled: true
    interval: 1m
    # murmur's live values: steam posts to GAMEBOT thread only
    thread_ids: "30738305889116993"
  free_games:
    enabled: true
    interval: 1m
    thread_ids: "30738305889116993,953525124128433"
  neon_usage:
    enabled: true
    interval: 1h
    warning_hours: 90
    thread_id: "2637078310061988"
    api_key_env:
      - NEON_ORG_API_KEY

persistence:
  enabled: true
  database_url: ""
  database_url_env: DATABASE_URL
  interval: 1m
  exclude:
    - sandboxes
    - whatsapp
    - incoming-attachments
    - logs

mcp:
  servers: []


